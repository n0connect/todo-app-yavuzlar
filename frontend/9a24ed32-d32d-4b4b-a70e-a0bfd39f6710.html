<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - internal server error | todo.app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container status-page">
        <div class="brand">
            <h1 class="brand-title">todo.app</h1>
            <p class="tagline">simple. <span class="secure-text" data-text="secure">secure</span>. minimal.</p>
        </div>

        <main class="status-content">
            <div class="status-code">500</div>
            <div class="status-text">internal server error</div>
            <p class="status-description">
                something went wrong on our side.
                your data is still encrypted and safe&mdash;please try again later.
            </p>
            <div class="status-actions">
                <a href="/" class="primary-link">↻ back to app</a>
            </div>
        </main>

        <footer class="login-footer">
            <p>encrypted with aes-256-gcm</p>
        </footer>
    </div>
</body>
</html>
