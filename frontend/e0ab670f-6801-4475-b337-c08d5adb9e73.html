<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - not found | todo.app</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container status-page">
        <div class="brand">
            <h1 class="brand-title">todo.app</h1>
            <p class="tagline">simple. <span class="secure-text" data-text="secure">secure</span>. minimal.</p>
        </div>

        <main class="status-content">
            <div class="status-code">404</div>
            <div class="status-text">not found</div>
            <p class="status-description">
                the thing you&rsquo;re looking for doesn&rsquo;t exist here.
                the url may be wrong or the resource was removed.
            </p>
        </main>

        <footer class="login-footer">
            <p>encrypted with aes-256-gcm</p>
        </footer>
    </div>
</body>
</html>
