<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self';"><title>Yavuzlar-Todo-App</title><link rel="stylesheet" href="styles.css"></head><body><div class="container"><h1>Yapilacaklar Listesi</h1><div class="input-box"><input type="text" id="todoInput" placeholder="Yeni görev ekle..." maxlength="200" pattern="[a-zA-ZçğıöşüÇĞİÖŞÜ0-9\s]+" title="Sadece harf, rakam ve boşluk karakterleri kullanabilirsiniz"><button id="addBtn">Ekle</button></div><div class="tag-box"><span>Etiket:</span><div class="tags"><button class="tag-btn active" data-tag="none">Yok</button><button class="tag-btn" data-tag="acil">Acil</button><button class="tag-btn" data-tag="is">İş</button><button class="tag-btn" data-tag="kisisel">Kişisel</button><button class="tag-btn" data-tag="alisveris">Alışveriş</button><button class="tag-btn" data-tag="saglik">Sağlık</button><button class="tag-btn" data-tag="egitim">Eğitim</button></div></div><div class="filter-box"><input type="text" id="searchInput" placeholder="Ara..." pattern="[a-zA-ZçğıöşüÇĞİÖŞÜ0-9\s]*" title="Sadece harf, rakam ve boşluk karakterleri kullanabilirsiniz"><div class="filter-tags"><button class="filter-btn active" data-filter="all">Tumu</button><button class="filter-btn" data-filter="acil">Acil</button><button class="filter-btn" data-filter="is">İş</button><button class="filter-btn" data-filter="kisisel">Kişisel</button><button class="filter-btn" data-filter="alisveris">Alışveriş</button><button class="filter-btn" data-filter="saglik">Sağlık</button><button class="filter-btn" data-filter="egitim">Eğitim</button></div></div><ul id="todoList"></ul><div id="emptyState" class="empty">Görev Ekleyiniz.</div><div class="stats"><span>Toplam:<strong id="totalCount">0</strong></span><span>Gösterilen:<strong id="visibleCount">0</strong></span></div></div><footer><p>Yavuzlar Yazılım Geliştirme ve Web Güvenliği Takımı</p></footer><script src="script.js"></script></body></html>
