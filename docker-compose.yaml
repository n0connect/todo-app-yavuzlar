services:
  postgres:
    image: postgres:15-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: dev.backend.Dockerfile
    container_name: todo-backend
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: ${DB_SSL_MODE}
      BACKEND_PORT: ${BACKEND_PORT}
      MASTER_KEY_ACTIVE: ${MASTER_KEY_ACTIVE}
      MASTER_KEY_ACTIVE_ID: ${MASTER_KEY_ACTIVE_ID}
      MASTER_KEY_OLD: ${MASTER_KEY_OLD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_MIN_LEN: ${JWT_SECRET_MIN_LEN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      ACCOUNT_LOOKUP_PEPPER: ${ACCOUNT_LOOKUP_PEPPER}
      MAX_BASE64_LOGIN_LEN: ${MAX_BASE64_LOGIN_LEN}
      MAX_BASE64_TODO_LEN: ${MAX_BASE64_TODO_LEN}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH}
      MAX_TITLE_LENGTH: ${MAX_TITLE_LENGTH}
      MIN_TITLE_LENGTH: ${MIN_TITLE_LENGTH}
      MAX_TAG_LENGTH: ${MAX_TAG_LENGTH}
      MAX_TAGS_PER_TODO: ${MAX_TAGS_PER_TODO}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB}
      ARGON2_TIME: ${ARGON2_TIME}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
      ARGON2_SALT_LENGTH: ${ARGON2_SALT_LENGTH}
      ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH}
      PENDING_TOKEN_TTL_SEC: ${PENDING_TOKEN_TTL_SEC}
      PENDING_CLEANUP_INTERVAL_SEC: ${PENDING_CLEANUP_INTERVAL_SEC}
      PENDING_ID_BYTES: ${PENDING_ID_BYTES}
      INTERNAL_ID_LENGTH: ${INTERNAL_ID_LENGTH}
      RATE_LIMIT_MAX_TOKENS: ${RATE_LIMIT_MAX_TOKENS}
      RATE_LIMIT_REFILL_INTERVAL_SEC: ${RATE_LIMIT_REFILL_INTERVAL_SEC}
      RATE_LIMIT_CLEANUP_INTERVAL_SEC: ${RATE_LIMIT_CLEANUP_INTERVAL_SEC}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS}
      SERVER_READ_HEADER_TIMEOUT_SEC: ${SERVER_READ_HEADER_TIMEOUT_SEC}
      SERVER_READ_TIMEOUT_SEC: ${SERVER_READ_TIMEOUT_SEC}
      SERVER_WRITE_TIMEOUT_SEC: ${SERVER_WRITE_TIMEOUT_SEC}
      SERVER_IDLE_TIMEOUT_SEC: ${SERVER_IDLE_TIMEOUT_SEC}
      SERVER_MAX_HEADER_BYTES: ${SERVER_MAX_HEADER_BYTES}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --post-data='{\"confirm\": false}' --header='Content-Type: application/json' --server-response --timeout=10 --tries=1 http://localhost:8080/api/v2/register -q -O /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: dev.frontend.Dockerfile
    container_name: todo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
